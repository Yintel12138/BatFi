name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Create AnalyticsDSN stub
        run: |
          cat > BatFiKit/Sources/ClientsLive/AnalyticsDSN.swift << 'EOF'
          import Foundation

          // This file is automatically generated in the CI process.
          // Do not modify or check into version control.
          let analyticsDSN = ""
          EOF

      - name: Build BatFi
        run: |
          # 使用 -derivedDataPath 指定输出路径为当前目录下的 build 文件夹
          # 这样我们能确切知道 .app 文件在哪里
          xcodebuild build \
            -project BatFi.xcodeproj \
            -scheme BatFi \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatFi-macOS-Binary
          # 路径指向 build 文件夹下的产品目录
          # 注意：如果是 Release 编译，路径中的 'Debug' 可能需要改为 'Release'
          path: build/Build/Products/Debug/*.app
          # 如果没有找到文件，直接让 Action 失败，方便排查
          if-no-files-found: error
          # 设置保留天数（可选）
          retention-days: 7
