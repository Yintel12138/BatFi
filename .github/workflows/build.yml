name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Create AnalyticsDSN stub
        run: |
          cat > BatFiKit/Sources/ClientsLive/AnalyticsDSN.swift << 'EOF'
          import Foundation

          // This file is automatically generated in the CI process.
          // Do not modify or check into version control.
          let analyticsDSN = ""
          EOF

      - name: Build BatFi
        run: |
          xcodebuild build \
            -project BatFi.xcodeproj \
            -scheme BatFi \
            -destination "generic/platform=macOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || xcodebuild build \
              -project BatFi.xcodeproj \
              -scheme BatFi \
              -destination "generic/platform=macOS" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
